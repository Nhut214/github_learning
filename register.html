<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .register-box {
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #218838;
        }
    </style>
</head>
<body>

    <div class="register-box">
        <h2>Đăng ký tài khoản</h2>

        <form>
            <input type="text"
                   placeholder="Họ và tên"
                   required>

            <input type="email"
                   placeholder="Email"
                   required>

            <input type="password"
                   placeholder="Mật khẩu"
                   required>

            <input type="password"
                   placeholder="Xác nhận mật khẩu"
                   required>

            <button type="submit">
                Đăng ký
            </button>
        </form>
    </div>

</body>
</html>
